
name: Replay V8 - 120FPS 100Mbps 1GB Buffer

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Replay V8 APK Olustur
    runs-on: ubuntu-latest
    timeout-minutes: 35

    steps:
      - name: Kaynak kodunu al
        uses: actions/checkout@v4

      - name: Replay V8 kaynak projesini ac
        shell: bash
        run: |
          set -euo pipefail

          ZIP="Replay-V8-Kaynak-Proje-2.zip"

          if [ ! -f "$ZIP" ]; then
            echo "HATA: Replay V8 kaynak ZIP bulunamadi!"
            exit 1
          fi

          unzip -oq "$ZIP"

          ROOT="ReplayGeriyeDonuk_v2"
          JAVA="$ROOT/app/src/main/java/com/example/replaygeri"

          test -f "$JAVA/MainActivity.java"
          test -f "$JAVA/ReplayCapture.java"
          test -f "$JAVA/ReplayBuffer.java"
          test -f "$JAVA/ReplayService.java"

          echo "Replay V8 kaynak kodlari bulundu."

      - name: V8 ozelliklerini dogrula
        shell: bash
        run: |
          set -euo pipefail

          JAVA="ReplayGeriyeDonuk_v2/app/src/main/java/com/example/replaygeri"

          grep -Fq '"75 Mbps"' \
            "$JAVA/MainActivity.java"

          grep -Fq '"100 Mbps"' \
            "$JAVA/MainActivity.java"

          grep -Fq '"120 FPS"' \
            "$JAVA/MainActivity.java"

          grep -Fq '1_073_741_824L' \
            "$JAVA/ReplayBuffer.java"

          grep -Fq '70_000_000L' \
            "$JAVA/ReplayBuffer.java"

          grep -Fq 'MIMETYPE_VIDEO_HEVC' \
            "$JAVA/ReplayCapture.java"

          grep -Fq 'MIMETYPE_VIDEO_AVC' \
            "$JAVA/ReplayCapture.java"

          grep -Fq 'spinOnce(bubble)' \
            "$JAVA/ReplayService.java"

          test -f \
            ReplayGeriyeDonuk_v2/app/src/main/res/drawable-nodpi/replay_launcher.webp

          echo "V8 ozellikleri dogrulandi."

      - name: Java 17 kur
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Android SDK kur
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Android 35 kur
        run: |
          sdkmanager 'platforms;android-35' 'build-tools;35.0.0'

      - name: Gradle 8.9 kur
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Replay V8 APK derle
        working-directory: ReplayGeriyeDonuk_v2
        run: |
          gradle --no-daemon :app:assembleDebug

      - name: Replay V8 APK yayimla
        uses: actions/upload-artifact@v4
        with:
          name: Replay-V8-APK
          path: ReplayGeriyeDonuk_v2/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
